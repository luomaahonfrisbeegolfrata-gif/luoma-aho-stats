<!DOCTYPE html>
<html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vieraskirja - Luoma-ahon Frisbeegolfrata</title>
<style>
:root{--bg:#070708;--card:#151515;--border:#242424;--green:#1aff1a;--gold:#ffcc00}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden;overflow-y:auto}
header{height:56px;min-height:56px;max-height:56px;background:#0f0f0f;border-bottom:1px solid #242424;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}.brand-logo{width:35px;height:35px;background:#fff;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.header-icons{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;flex-shrink:0}
.wrap{max-width:1920px;margin:0 auto;padding:10px}
.grid-vieraskirja{display:grid;grid-template-columns:340px 1fr;gap:10px}
.card{background:#151515;border:1px solid #242424;border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.card-form{height:560px;min-height:560px;max-height:560px;width:340px;min-width:340px;max-width:340px}
.card-list{height:560px;min-height:560px;max-height:560px;width:100%;min-width:320px}
.top10-title{font-size:11px;color:#aaa;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #222;background:#111;flex-shrink:0}
.top10-title b{color:#1aff1a;font-size:10px}
.form-body{flex:1;padding:12px;display:flex;flex-direction:column;overflow-y:auto}
label{font-size:10px;color:#888;text-transform:uppercase;font-weight:700;display:block;margin:10px 0 5px 0}
input[type="text"], textarea{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:6px;color:#fff;padding:8px 10px;font-family:inherit;font-size:12px;outline:none;transition:border 0.2s}
input[type="text"]:focus, textarea:focus{border-color:#1aff1a}
textarea{resize:none;flex:1;min-height:80px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;margin-top:10px;background:#1aff1a;color:#000;border:0;border-radius:8px;padding:10px;font-weight:800;font-size:12px;cursor:pointer;letter-spacing:0.3px}
.btn:active{transform:scale(0.98)}
.btn-secondary{background:#222;color:#fff;border:1px solid #333;margin-top:6px;font-size:11px;padding:8px}
.tiedote-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:0;display:flex;flex-direction:column}
.tiedote-list::-webkit-scrollbar{width:4px}
.tiedote-list::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.tiedote-item{padding:10px 12px;border-bottom:1px solid #1e1e1e;transition:background 0.2s}
.tiedote-item:hover{background:#1a1a1a}
.tiedote-item.new{background:#1aff1a0a;border-left:2px solid #1aff1a}
.tiedote-date{font-size:9px;color:#666;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tiedote-title{font-size:12px;font-weight:800;color:#1aff1a;margin:3px 0;display:flex;align-items:center;gap:6px}
.tiedote-msg{font-size:11px;color:#bbb;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.badge-new{background:#1aff1a;color:#000;font-size:8px;font-weight:800;padding:1px 5px;border-radius:8px;margin-left:6px}
.counter{font-size:10px;color:#666;margin-top:6px;text-align:right}
.json-box{margin-top:10px;background:#0a0a0a;border:1px solid #1aff1a33;border-radius:6px;padding:10px;display:none;max-height:200px;overflow:auto}
.json-box h3{margin:0 0 6px 0;font-size:10px;color:#1aff1a}
.json-box pre{margin:0;font-size:9px;color:#888;white-space:pre-wrap;word-break:break-all;background:#000;padding:6px;border-radius:4px;max-height:120px;overflow:auto}
.empty{color:#666;font-size:12px;text-align:center;padding:40px 20px;border:1px dashed #242424;border-radius:8px;margin:10px}
/* TÄHTIARVOSTELU */
.stars-input{display:flex;gap:4px;margin:6px 0 4px 0}
.star-input{font-size:22px;color:#333;cursor:pointer;transition:color 0.15s, transform 0.1s;user-select:none}
.star-input:hover{transform:scale(1.2)}
.star-input.active{color:var(--gold)}
.star-input.hover{color:#ffdd44}
.stars-display{display:inline-flex;gap:1px;font-size:11px}
.star-display{color:#333}
.star-display.filled{color:var(--gold)}
.rating-label{font-size:10px;color:#666;margin-left:6px}
.avg-box{display:flex;align-items:center;gap:6px;background:#1a1a1a;border:1px solid #242424;border-radius:8px;padding:6px 10px;margin:8px 10px}
.avg-stars{font-size:14px;color:var(--gold)}
.avg-text{font-size:11px;color:#fff;font-weight:700}
.avg-count{font-size:9px;color:#666}
@media (max-width:768px){
  .wrap{padding:10px}
  .grid-vieraskirja{grid-template-columns:1fr!important;gap:10px}
  .card-form{width:100%!important;min-width:100%!important;max-width:100%!important;height:auto!important;min-height:380px!important}
  .card-list{width:100%!important;min-width:100%!important;height:560px!important}
}
</style></head><body>

<div class="wrap">
<div class="grid-vieraskirja">
<div class="card card-form">
<div class="top10-title"><span>VIERASKIRJA - KIRJOITA</span><b style="color:#1aff1a">LIVE</b></div>
<div class="form-body">
<label for="v-name">Nimi / Nimimerkki</label>
<input type="text" id="v-name" placeholder="Esim. Jari - Seinäjoki" maxlength="30" />
<label>Arvostelu</label>
<div class="stars-input" id="stars-input">
<span class="star-input" data-val="1">★</span>
<span class="star-input" data-val="2">★</span>
<span class="star-input" data-val="3">★</span>
<span class="star-input" data-val="4">★</span>
<span class="star-input" data-val="5">★</span>
<span class="rating-label" id="rating-label">Valitse 1-5 tähteä</span>
</div>
<label for="v-msg">Viesti</label>
<textarea id="v-msg" placeholder="Miten rata maistui? Risut, ruusut, holarit, kehitysideat..." maxlength="500"></textarea>
<div class="counter"><span id="v-counter">0</span> / 500</div>
<button class="btn" id="v-send">LÄHETÄ VIESTI →</button>
<div class="json-box" id="json-box">
<h3>📦 JSON PÄIVITETTY</h3>
<pre id="json-preview"></pre>
<div style="display:flex;gap:6px;margin-top:6px">
<button class="btn-secondary" id="btn-download" style="flex:1">⬇️ LATAA</button>
<button class="btn-secondary" id="btn-copy" style="flex:1">📋 KOPIOI</button>
</div>
<p style="font-size:9px;color:#555;margin-top:6px">Kopioi GitHubiin: data/vieraskirja.json → Commit<br>Workflow päivittää keskiarvon automaattisesti!</p>
</div>
</div>
</div>

<div class="card card-list">
<div class="top10-title"><span>VIERASKIRJA - VIESTIT</span><b id="v-count" style="color:#1aff1a">0 viestiä</b></div>
<div class="avg-box" id="avg-box" style="display:none">
<span class="avg-stars" id="avg-stars">★★★★★</span>
<span class="avg-text" id="avg-text">4.8</span>
<span class="avg-count" id="avg-count">(0 arvostelua)</span>
</div>
<div class="tiedote-list" id="v-list"></div>
</div>
</div>
</div>

<script>
const STORAGE_KEY="luoma_vieraskirja_v1";
const JSON_PATH="data/vieraskirja.json";
let jsonEntries=[],localEntries=[],allEntries=[];
let selectedRating=0;

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function formatDate(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;}
function loadLocal(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)localEntries=JSON.parse(s);}catch(e){localEntries=[];}}
function saveLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(allEntries));}catch(e){}}
function merge(){const m=new Map();jsonEntries.forEach(e=>{m.set(`${e.date}|${e.name}|${e.message}`,e);});localEntries.forEach(e=>{const k=`${e.date}|${e.name}|${e.message}`;if(!m.has(k))m.set(k,e);});allEntries=Array.from(m.values());allEntries.sort((a,b)=>{const[da,ma,ya]=a.date.split('.').map(Number);const[db,mb,yb]=b.date.split('.').map(Number);return new Date(ya,ma-1,da)-new Date(yb,mb-1,db);});}
function renderStars(rating){
  let html='';
  for(let i=1;i<=5;i++){
    html+=`<span class="star-display ${i<=rating?'filled':''}">★</span>`;
  }
  return html;
}
function render(){
  const $list=document.getElementById("v-list"),$count=document.getElementById("v-count");
  $list.innerHTML="";
  if(!allEntries.length){
    $list.innerHTML=`<div class="empty">Ei vielä viestejä. Ole ensimmäinen! 🥏</div>`;
    $count.textContent="0 viestiä";
    document.getElementById("avg-box").style.display="none";
    return;
  }
  $count.textContent=`${allEntries.length} viestiä`;
  // Keskiarvo
  const ratings=allEntries.filter(e=>e.rating).map(e=>e.rating);
  if(ratings.length>0){
    const avg=(ratings.reduce((a,b)=>a+b,0)/ratings.length);
    const avgRounded=Math.round(avg*10)/10;
    document.getElementById("avg-box").style.display="flex";
    document.getElementById("avg-text").textContent=avgRounded.toFixed(1);
    document.getElementById("avg-count").textContent=`(${ratings.length} arvostelua)`;
    document.getElementById("avg-stars").innerHTML=renderStars(Math.round(avg));
  }
  const jsonKeys=new Set(jsonEntries.map(e=>`${e.date}|${e.name}|${e.message}`));
  [...allEntries].reverse().forEach(e=>{
    const isNew=!jsonKeys.has(`${e.date}|${e.name}|${e.message}`);
    const rating=e.rating||0;
    const div=document.createElement("div");
    div.className="tiedote-item"+(isNew?" new":"");
    div.innerHTML=`<div class="tiedote-date"><span>${esc(e.date)}</span>${isNew?'<span class="badge-new">UUSI</span>':''}</div><div class="tiedote-title">${esc(e.name)} <span class="stars-display">${renderStars(rating)}</span></div><div class="tiedote-msg">${esc(e.message)}</div>`;
    $list.appendChild(div);
  });
}
function updatePreview(){
  const total= allEntries.length;
  const ratings=allEntries.filter(e=>e.rating).map(e=>e.rating);
  const avg=ratings.length? (ratings.reduce((a,b)=>a+b,0)/ratings.length):0;
  const obj={entries:allEntries, stats:{count:total, avg: Math.round(avg*10)/10, ratings: ratings.length}, updated: new Date().toISOString().slice(0,10)};
  const txt=JSON.stringify(obj,null,2);
  document.getElementById("json-preview").textContent=txt;
  document.getElementById("json-box").style.display="block";
  return txt;
}
async function loadJson(){
  try{
    const r=await fetch(`${JSON_PATH}?v=${Date.now()}`,{cache:"no-store"});
    if(r.ok){
      const j=await r.json();
      if(j.entries&&Array.isArray(j.entries))jsonEntries=j.entries;
      else if(Array.isArray(j))jsonEntries=j;
    }
  }catch(e){}
  loadLocal();merge();render();
}
loadJson();

// TÄHTIARVOSTELU LOGIIKKA
const stars=document.querySelectorAll('.star-input');
const label=document.getElementById('rating-label');
function updateStarsInput(val, hover=false){
  stars.forEach(s=>{
    const v=parseInt(s.dataset.val);
    if(hover){
      s.classList.toggle('hover', v<=val);
    }else{
      s.classList.toggle('active', v<=val);
    }
  });
  if(!hover){
    const texts=["","Huono 😞","Kohtalainen 😐","Hyvä 🙂","Erittäin hyvä 😊","Huippu! 🤩"];
    label.textContent=texts[val]||"Valitse 1-5 tähteä";
    label.style.color=val?"#ffcc00":"#666";
  }
}
stars.forEach(s=>{
  s.addEventListener('mouseenter',()=>{updateStarsInput(parseInt(s.dataset.val), true);});
  s.addEventListener('mouseleave',()=>{stars.forEach(x=>x.classList.remove('hover'));});
  s.addEventListener('click',()=>{
    selectedRating=parseInt(s.dataset.val);
    updateStarsInput(selectedRating, false);
  });
});

const $name=document.getElementById("v-name"),$msg=document.getElementById("v-msg"),$counter=document.getElementById("v-counter"),$send=document.getElementById("v-send");
$msg.addEventListener("input",()=>{$counter.textContent=$msg.value.length;});
$send.addEventListener("click",()=>{
  const name=$name.value.trim()||"Anonyymi",msg=$msg.value.trim();
  if(msg.length<3){$msg.focus();$msg.style.borderColor="#ff4d4d";setTimeout(()=>{$msg.style.borderColor=""},1500);return;}
  if(selectedRating===0){label.textContent="⚠️ Valitse ensin tähdet!";label.style.color="#ff4d4d";document.getElementById('stars-input').style.border="1px solid #ff4d4d";setTimeout(()=>{document.getElementById('stars-input').style.border="";},1500);return;}
  const ne={date:formatDate(),name:name.slice(0,30),message:msg.slice(0,500),rating:selectedRating};
  allEntries.push(ne);saveLocal();render();updatePreview();
  $name.value="";$msg.value="";$counter.textContent="0";selectedRating=0;updateStarsInput(0);
  $send.textContent="✓ LISÄTTY - "+ne.rating+"★";
  setTimeout(()=>{$send.textContent="LÄHETÄ VIESTI →";},2000);
});
document.getElementById("btn-download").addEventListener("click",()=>{
  const txt=document.getElementById("json-preview").textContent;
  const blob=new Blob([txt],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="vieraskirja.json";a.click();URL.revokeObjectURL(url);
});
document.getElementById("btn-copy").addEventListener("click",async()=>{
  const txt=document.getElementById("json-preview").textContent;
  try{await navigator.clipboard.writeText(txt);document.getElementById("btn-copy").textContent="✓ KOPIOITU!";setTimeout(()=>{document.getElementById("btn-copy").textContent="📋 KOPIOI"},1500);}catch(e){alert("Kopioi manuaalisesti");}
});
</script>
</body></html>

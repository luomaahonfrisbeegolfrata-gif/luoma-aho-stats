*{box-sizing:border-box;margin:0;padding:0}
body{background:#070708;color:#e6e6e6;font-family:Inter,sans-serif;padding:0 12px 30px}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 14px;background:#040404;border-bottom:1px solid #1e1e1e;position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.header-left img{height:48px;width:48px;object-fit:cover;border-radius:8px;background:#111}
.header-left h1{font-size:18px}
.header-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.header-right a{display:block;line-height:0;border-radius:10px;overflow:hidden}
.header-right img.logo-square{width:48px;height:48px;min-width:48px;background:#fff;border-radius:10px;object-fit:cover;border:1px solid #222;display:block}
.header-right img.logo-rect{width:88px;height:48px;min-width:88px;background:#fff;border-radius:10px;object-fit:cover;border:1px solid #222;display:block}
.header-right img.logo-rect-wide{width:110px;height:48px;min-width:110px;background:#fff;border-radius:10px;padding:4px 6px;object-fit:contain;border:1px solid #222;display:block}

.grid-top{display:grid;grid-template-columns:300px 300px 300px 300px 1fr;gap:12px;margin:12px 0;align-items:stretch}
.grid-middle{display:grid;grid-template-columns:300px 300px 300px;gap:12px;margin:12px 0;align-items:stretch}

.card{background:#151516;border:1px solid #262626;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.card-title{font-size:12px;color:#8a8a8a;text-transform:uppercase;font-weight:800;margin-bottom:6px;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}
.live-dot{color:#1aff1a;font-size:9px;line-height:1}
.big{font-size:36px;font-weight:900;color:#fff;text-align:center}

.card.ratainfo-card{width:300px;min-width:300px;max-width:300px;min-height:350px;height:350px;max-height:350px;padding:10px 10px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.ratainfo{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:2px;
  font-size:11.5px;
  line-height:1.25;
  color:#e0e0e0;
  letter-spacing:-0.1px;
  overflow:hidden;
}
.ratainfo div{white-space:normal;word-break:break-word;overflow:hidden;text-overflow:ellipsis;min-height:0}
.ratainfo p{margin:0;}

.card.combined-card{width:300px;min-width:300px;max-width:300px;min-height:350px;height:350px;padding:0 !important;overflow:hidden;display:flex;flex-direction:column}
.split-half{padding:14px 12px;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.split-half+.split-half{border-top:1px solid #262626}

.card.hio-card{width:300px;min-width:300px;max-width:300px;min-height:350px;height:350px;max-height:350px;padding:14px 12px 16px 12px;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;text-align:center;overflow:hidden}
.card.hio-card .big{font-size:38px;margin:2px 0 6px 0;flex-shrink:0;line-height:1}
.hio-list{flex:1;width:100%;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:6px;padding:8px 0 4px 0;overflow:hidden}
.hio-item{font-size:13.5px;padding:2.5px 0;color:#e8e8e8;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.hio-item.vayla-header{font-size:15px;font-weight:900;color:#1aff1a;margin:10px 0 3px 0}
.hio-item.vayla-header:first-child{margin-top:0}

.card.saa-card{width:300px;min-width:300px;max-width:300px;min-height:350px;height:350px;padding:0 !important;background:#0f0f10;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}

.stacked-right{width:100%;height:350px;display:flex;flex-direction:column;gap:8px}
.mini-card{flex:1;background:#151516;border:1px solid #262626;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px}
.mini-card .big{font-size:22px !important}

.card.top10-card{width:300px;min-width:300px;max-width:300px;min-height:350px;height:350px;max-height:350px;padding:0 !important;overflow:hidden;display:flex;flex-direction:column}
.top10-header{padding:10px 12px;background:#111113;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.top10-header h3{font-size:11px;text-transform:uppercase;letter-spacing:0.7px;color:#8a8a8a;display:flex;align-items:center;gap:5px}
.top10-header a{color:#1aff1a;font-size:10px;text-decoration:none;font-weight:800}
.top10-list{flex:1;padding:4px 12px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden;gap:0}
.top10-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e1e1e;font-size:11px;min-height:28px;max-height:28px;height:28px;flex-shrink:0}
.top10-item:last-child{border-bottom:none}
.top10-item .rank{color:#1aff1a;font-weight:900;min-width:24px;font-size:11px}
.top10-item .name{flex:1;color:#e0e0e0;font-weight:600;margin:0 8px;white-space:normal;overflow:hidden;text-overflow:ellipsis;word-break:break-word;line-height:1.2;font-size:11px}
.top10-item .scores{display:flex;align-items:center;gap:6px;min-width:80px;justify-content:flex-end}
.top10-item .total{color:#fff;font-weight:800;font-size:12px;min-width:24px;text-align:right;transform:translateX(-3px)}
.top10-item .plus{font-weight:700;font-size:10px;min-width:32px;text-align:left}
.top10-item .plus.negative{color:#1aff1a}
.top10-item .plus.positive{color:#ff4d4d}
.top10-item .plus.even{color:#8a8a8a}
.top10-footer{padding:6px 12px;background:#0a0a0a;border-top:1px solid #222;font-size:8px;color:#666;text-align:center;flex-shrink:0}

.vayla-head{background:#111113;border:1px solid #262626;border-bottom:none;border-radius:12px 12px 0 0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.vayla-head h2{font-size:10px;text-transform:uppercase;letter-spacing:0.7px}
.badge{background:#1aff1a;color:#000;font-size:9px;padding:2px 8px;border-radius:20px;font-weight:900}
.vayla-wrap{background:#0f0f10;border:1px solid #262626;border-radius:0 0 12px 12px;overflow:hidden}
.vayla-wrap img{width:100%;display:block;background:#0a0a0a;min-height:180px}

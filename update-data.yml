name: Auto 5min v5.1 DYNAMIC TOP5 FIX

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python fetch_data.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@luoma-aho.fi"
          git add data/*.json
          git diff --staged --quiet || (git commit -m "auto v5.1 data" && git push)

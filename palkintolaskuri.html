<!DOCTYPE html>
<html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Palkintolaskuri - Luoma-ahon Frisbeegolfrata</title>
<style>
:root{--bg:#070708;--card:#151515;--border:#242424;--green:#1aff1a;--gold:#ffcc00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
header{height:56px;min-height:56px;background:#0f0f0f;border-bottom:1px solid #242424;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 10px;position:sticky;top:0;z-index:100;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;min-width:0}
.brand-logo{width:70px;height:35px;min-width:70px;background:#fff;border-radius:8px;overflow:hidden;display:grid;place-items:center;flex-shrink:0;border:1px solid #1aff1a55}
.brand-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-icons{display:flex;gap:5px;align-items:center;flex-shrink:0}
.wrap{max-width:1920px;margin:0 auto;padding:8px;width:100%}
.grid-laskuri{display:grid;grid-template-columns:340px 1fr;gap:8px;width:100%}
.card{background:#151515;border:1px solid #242424;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;width:100%}
.card-form{height:560px;min-height:560px;width:340px;min-width:340px}
.card-list{height:560px;min-height:560px;width:100%;min-width:0}
.top10-title{font-size:11px;color:#aaa;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid #222;background:#111;flex-shrink:0}
.top10-title b{color:#1aff1a;font-size:10px}
.form-body{flex:1;padding:10px;display:flex;flex-direction:column;overflow-y:auto}
label{font-size:10px;color:#888;text-transform:uppercase;font-weight:700;display:block;margin:8px 0 4px 0}
input[type="number"],select{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:6px;color:#fff;padding:8px 10px;font-family:inherit;font-size:13px;outline:none}
input[type="number"]:focus,select:focus{border-color:#1aff1a}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;margin-top:10px;background:#1aff1a;color:#000;border:0;border-radius:8px;padding:10px;font-weight:800;font-size:12px;cursor:pointer;flex-shrink:0}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-bottom:1px solid #1e1e1e;font-size:12px;gap:8px}
.result-row.highlight{background:#1a1a0a;border-left:3px solid #1aff1a}
.result-label{color:#888;font-size:11px;flex-shrink:0} .result-val{font-weight:800;font-size:13px;text-align:right}
.result-val.green{color:#1aff1a}
.big-pot{font-size:28px;font-weight:900;text-align:center;margin:8px 0;color:#1aff1a;line-height:1}
.podium{display:flex;gap:6px;padding:8px}
.podium-item{flex:1;min-width:0;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 4px;text-align:center}
.podium-rank{font-size:9px;color:#888;text-transform:uppercase;font-weight:700}
.podium-amount{font-size:16px;font-weight:900;color:#fff;margin-top:4px;word-break:break-all}
.podium-item.first{border-color:#ffcc00;background:#1a1500}
.podium-item.second{border-color:#555}
.podium-item.third{border-color:#8a5a2b}
@media (max-width:768px){
  html,body{height:100dvh;overflow:hidden;overscroll-behavior:none}
  header{padding:0 6px 0 8px}
  .brand{font-size:12px;gap:6px}
  .brand-logo{width:70px;min-width:70px;height:35px}
  .brand-text{font-size:12px}
  .header-icons{gap:4px}
  .header-icons a{width:56px!important;min-width:56px!important;height:32px!important}
  .header-icons a img{width:56px!important;height:32px!important}
  .wrap{height:calc(100dvh - 56px);padding:6px;display:flex;flex-direction:column;overflow:hidden}
  .grid-laskuri{flex:1;display:flex;flex-direction:column;gap:6px;overflow:hidden;height:100%;grid-template-columns:1fr}
  .card-form{flex:0 0 48%;height:auto!important;min-height:0!important;max-height:48%;width:100%!important;min-width:100%!important;overflow:hidden}
  .card-list{flex:1 1 52%;height:auto!important;min-height:0!important;max-height:52%;width:100%!important;min-width:100%!important;overflow:hidden}
  .form-body{padding:8px;overflow:hidden;gap:0}
  label{margin:5px 0 2px 0;font-size:9px}
  input[type="number"],select{padding:5px 8px;font-size:12px}
  .btn{margin-top:6px;padding:7px;font-size:11px}
  .top10-title{padding:5px 8px;font-size:10px}
  .big-pot{font-size:20px;margin:4px 0}
  .result-row{padding:5px 8px;font-size:11px}
  .podium{padding:6px;gap:5px}
  .podium-item{padding:6px 2px}
  .podium-amount{font-size:13px}
  .result-val{font-size:12px}
}
@media (max-width:380px){
  .brand-text{display:none}
  .podium-amount{font-size:12px}
}
</style></head><body>
<header>
<div class="brand"><div class="brand-logo"><img src="logot/1000mrkkaa.jpg" alt="1000" style="width:70px;height:35px;object-fit:cover;display:block"/></div><span class="brand-text">Luoma-ahon Frisbeegolfrata</span></div>
<div class="header-icons">
<a href="./palkintolaskuri.html" style="width:71px;height:35px;min-width:71px;background:#111;border:1px solid #1aff1a88;border-radius:8px;overflow:hidden;display:grid;place-items:center;text-decoration:none"><img src="logot/1000mrkkaa.jpg" alt="1000" style="width:71px;height:35px;object-fit:cover;display:block"/></a>
<a href="./vieraskirja.html" style="width:71px;height:35px;min-width:71px;background:#222;color:#fff;border:1px solid #333;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;text-decoration:none">VIERASKIRJA</a>
<a href="./index.html" style="width:71px;height:35px;min-width:71px;background:#1aff1a;color:#000;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;text-decoration:none">ETUSIVU</a>
</div></header>
<div class="wrap"><div class="grid-laskuri">
<div class="card card-form"><div class="top10-title"><span>PALKINTOLASKURI</span><b>LIVE</b></div><div class="form-body">
<label for="p-count">Osallistujia</label><input type="number" id="p-count" min="1" max="500" value="20"/>
<label for="p-fee">Maksu</label><select id="p-fee"><option value="2">2 €</option><option value="4">4 €</option><option value="5" selected>5 €</option><option value="6">6 €</option><option value="8">8 €</option><option value="10">10 €</option></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<div><label for="p-pot">Potti / Järj.</label><select id="p-pot"><option value="80" selected>80% / 20%</option><option value="100">100% / 0%</option><option value="70">70% / 30%</option><option value="50">50% / 50%</option></select></div>
<div><label for="p-round">Pyöristys</label><select id="p-round"><option value="1" selected>0,50€</option><option value="0">Ei</option></select></div>
</div>
<label>Jako</label>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px">
<div><label style="margin-top:0">1.</label><select id="p-1"><option value="50" selected>50%</option><option value="60">60%</option><option value="40">40%</option></select></div>
<div><label style="margin-top:0">2.</label><select id="p-2"><option value="30" selected>30%</option><option value="25">25%</option><option value="20">20%</option></select></div>
<div><label style="margin-top:0">3.</label><select id="p-3"><option value="20" selected>20%</option><option value="15">15%</option><option value="30">30%</option></select></div>
</div>
<button class="btn" id="p-calc">LASKE →</button>
</div></div>
<div class="card card-list"><div class="top10-title"><span>TULOS</span><b id="p-summary">20 x 5€</b></div>
<div style="padding:6px 10px;text-align:center"><div class="big-pot" id="p-total">100 €</div></div>
<div class="result-row"><span class="result-label">Järjestäjälle 20%</span><span class="result-val" id="p-org">20 €</span></div>
<div class="result-row highlight"><span class="result-label">Potti 80%</span><span class="result-val green" id="p-prize">80 €</span></div>
<div class="podium">
<div class="podium-item first"><div class="podium-rank">1.</div><div class="podium-amount" id="p-1-amount">40 €</div></div>
<div class="podium-item second"><div class="podium-rank">2.</div><div class="podium-amount" id="p-2-amount">24 €</div></div>
<div class="podium-item third"><div class="podium-rank">3.</div><div class="podium-amount" id="p-3-amount">16 €</div></div>
</div>
</div>
</div></div>
<script>
function roundToHalf(v){return Math.round(v*2)/2;}
function fmt(v){return (Math.round(v*100)/100).toString().replace('.',',').replace(',00','') + ' €';}
function calc(){
  const count=parseInt(document.getElementById('p-count').value)||0;
  const fee=parseFloat(document.getElementById('p-fee').value)||0;
  const potPct=parseFloat(document.getElementById('p-pot').value)||80;
  const p1=parseFloat(document.getElementById('p-1').value)||50;
  const p2=parseFloat(document.getElementById('p-2').value)||30;
  const p3=parseFloat(document.getElementById('p-3').value)||20;
  const doRound=document.getElementById('p-round').value==='1';
  const total=count*fee;
  const prize=total*potPct/100;
  const org=total-prize;
  let a1=prize*p1/100, a2=prize*p2/100, a3=prize*p3/100;
  if(doRound){a1=roundToHalf(a1);a2=roundToHalf(a2);a3=roundToHalf(a3);}
  document.getElementById('p-summary').textContent=count+' x '+fee+'€';
  document.getElementById('p-total').textContent=total+' €';
  document.getElementById('p-org').textContent=fmt(org);
  document.getElementById('p-prize').textContent=fmt(prize);
  document.getElementById('p-1-amount').textContent=fmt(a1);
  document.getElementById('p-2-amount').textContent=fmt(a2);
  document.getElementById('p-3-amount').textContent=fmt(a3);
}
document.getElementById('p-calc').addEventListener('click',calc);
['p-count','p-fee','p-pot','p-1','p-2','p-3','p-round'].forEach(function(id){
  const el=document.getElementById(id);
  el.addEventListener('change',calc);
  el.addEventListener('input',calc);
});
calc();
</script>
</body></html>

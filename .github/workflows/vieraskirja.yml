name: Vieraskirja V5.1

on:
  push:
    paths:
      - 'data/vieraskirja.json'
      - 'vieraskirja.json'
  workflow_dispatch:

concurrency:
  group: vieraskirja
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate JSON
        run: |
          python -m json.tool data/vieraskirja.json > /dev/null && echo "✅ JSON valid"
          python -c "import json; d=json.load(open('data/vieraskirja.json')); print(f\"Entries: {len(d.get('entries',[]))}\")"
          python vieraskirja.py || echo "skip"

name: Update stats

on:
  schedule:
    - cron: '*/30 * * * *'          # kilpailut ja tilanne; GitHub voi viivästyttää ajoa
  push:
    branches: [main]
    paths: ['scripts/config.json', 'scripts/build_stats.py']
  workflow_dispatch:

concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      # Laskee kierrokset.json + vaylatilasto.json config.json:sta (kirjoittaa vain jos sisältö muuttui)
      - name: Build stats
        run: python scripts/build_stats.py

      - name: Metrix competitions and standings
        id: comp
        continue-on-error: true
        run: python scripts/metrix_competitions.py

      # Valinnainen: top10-haku, jos scripts/metrix_fetcher.py on repossa
      - name: Metrix top10
        id: top10
        continue-on-error: true
        run: |
          if [ -f scripts/metrix_fetcher.py ]; then python scripts/metrix_fetcher.py; else echo "metrix_fetcher.py puuttuu, ohitetaan"; fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

      # Näkyviin Actions-listaan jos jokin haku kaatui (ei enää '|| true' -piilotusta)
      - name: Fail if a fetch failed
        if: steps.comp.outcome == 'failure' || steps.top10.outcome == 'failure'
        run: |
          echo "Jokin datahaku epäonnistui, katso edelliset vaiheet"
          exit 1

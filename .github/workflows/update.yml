name: Update Stats V5.1

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4 lxml || true
      - name: Fetch Metrix
        continue-on-error: true
        run: |
          if [ -f scripts/metrix_fetcher.py ]; then python scripts/metrix_fetcher.py || true
          elif [ -f metrix_fetcher.py ]; then python metrix_fetcher.py || true; fi
      - name: Fetch UDisc
        continue-on-error: true
        run: |
          if [ -f scripts/udisc_fetcher.py ]; then python scripts/udisc_fetcher.py || true
          elif [ -f udisc_fetcher.py ]; then python udisc_fetcher.py || true; fi
      - name: Fetch Väylätilasto
        continue-on-error: true
        run: |
          if [ -f scripts/vaylatilasto_fetcher.py ]; then python scripts/vaylatilasto_fetcher.py || true
          elif [ -f vaylatilasto_fetcher.py ]; then python vaylatilasto_fetcher.py || true; fi
      - name: Fetch Tiedotteet
        continue-on-error: true
        run: |
          if [ -f scripts/tiedotteet_fetcher.py ]; then python scripts/tiedotteet_fetcher.py || true
          elif [ -f tiedotteet_fetcher.py ]; then python tiedotteet_fetcher.py || true; fi
      - name: Calculate Kierrokset
        continue-on-error: true
        run: |
          if [ -f scripts/kierrokset.py ]; then python scripts/kierrokset.py || true
          elif [ -f kierrokset.py ]; then python kierrokset.py || true; fi
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "V5.1 update - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git pull --rebase origin main || true
          git push || echo "Push failed"

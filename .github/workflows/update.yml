name: Update stats

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Show structure
        run: |
          ls -la
          ls -la data/ || echo "no data dir"
          ls -la scripts/ || echo "no scripts dir"

      - name: Fetch Metrix kilpailut tilanne (direct to card)
        run: |
          if [ -f scripts/metrix_tilanne_fetcher.py ]; then
            python scripts/metrix_tilanne_fetcher.py
          elif [ -f metrix_tilanne_fetcher.py ]; then
            python metrix_tilanne_fetcher.py
          else
            echo "metrix_tilanne_fetcher.py not found, skipping"
          fi

      - name: Fetch Metrix top10 (optional)
        continue-on-error: true
        run: |
          if [ -f scripts/metrix_fetcher.py ]; then python scripts/metrix_fetcher.py || echo "metrix_fetcher failed, continue"
          elif [ -f metrix_fetcher.py ]; then python metrix_fetcher.py || echo "metrix_fetcher failed"
          else echo "metrix_fetcher.py puuttuu, ohitetaan"; fi

      - name: Keep kierrokset locked (do not overwrite manual 1221)
        run: |
          echo "kierrokset.json pidetään lukittuna 1221 - ei ajeta kierrokset.py automaattisesti"
          cat data/kierrokset.json || echo "no kierrokset"
          cat data/udisc.json | head -20

      - name: Show results
        run: |
          ls -lh data/
          cat data/kilpailu_tilanne.json | head -100 || echo "no tilanne"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ) - tilanne + top10"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

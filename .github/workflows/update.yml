name: Update DiscGolf Stats V30 - Tiedotteet + Parent 43119

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch Metrix parent 43119 + 44010,44763
        run: |
          if [ -f scripts/metrix_fetcher.py ]; then python scripts/metrix_fetcher.py
          elif [ -f metrix_fetcher.py ]; then python metrix_fetcher.py
          else echo "metrix_fetcher.py not found" && exit 1; fi

      - name: Fetch UDisc
        run: |
          if [ -f scripts/udisc_fetcher.py ]; then python scripts/udisc_fetcher.py
          elif [ -f udisc_fetcher.py ]; then python udisc_fetcher.py
          else echo "skip udisc"; fi

      - name: Fetch Vaylatilasto
        run: |
          if [ -f scripts/vaylatilasto_fetcher.py ]; then python scripts/vaylatilasto_fetcher.py
          elif [ -f vaylatilasto_fetcher.py ]; then python vaylatilasto_fetcher.py
          else echo "skip vayla"; fi

      - name: Fetch Tiedotteet (manual - keep existing)
        run: |
          if [ -f scripts/tiedotteet_fetcher.py ]; then python scripts/tiedotteet_fetcher.py
          elif [ -f tiedotteet_fetcher.py ]; then python tiedotteet_fetcher.py
          else echo "tiedotteet_fetcher.py not found - creating default"; mkdir -p data; echo '{"tiedotteet":[]}' > data/tiedotteet.json; fi

      - name: Calculate Kierrokset
        run: |
          if [ -f scripts/kierrokset.py ]; then python scripts/kierrokset.py
          elif [ -f kierrokset.py ]; then python kierrokset.py
          else echo "kierrokset.py not found" && exit 1; fi

      - name: Show results
        run: |
          ls -lh data/
          cat data/kierrokset.json || true
          cat data/tiedotteet.json || true

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "V30 Tiedotteet + parent 43119 - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

name: Väylätilasto V15 - Header/Layout/Kortit lukittu
on:
  schedule:
    - cron: '0 */6 * * *'  # 6h
  workflow_dispatch:
jobs:
  update-vaylatilasto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python vaylatilasto_fetcher.py
      - name: Validate schema
        run: |
          python -c "import json; d=json.load(open('data/vaylatilasto.json')); assert set(d['44010']['difficulty'])==set(range(1,13)); print('Schema OK')"
      - name: Commit if changed - only data/
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/vaylatilasto.json data/vaylatilasto.png data/status.json vaylatilasto.png || true
          git diff --staged --quiet || git commit -m "V15 B avg-par - header/layout/cards lukittu"
          git push || true

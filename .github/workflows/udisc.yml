name: UDisc V15 - Header/Layout/Kortit lukittu
on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
jobs:
  update-udisc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python udisc_fetcher.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/udisc.json data/udisc_top10.json data/status.json || true
          git diff --staged --quiet || git commit -m "V15 UDisc - header/layout/cards lukittu"
          git push || true

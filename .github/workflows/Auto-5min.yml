name: DATA ONLY AUTO 5min - Metrix + PNG vari tiukka
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install matplotlib requests beautifulsoup4
      - name: Fetch Metrix 44010 3 kierrosta talla viikolla
        run: python metrix_fetcher.py
      - name: Generoi vaylatilasto PNG vari tiukka
        run: python scraper.py
      - name: Commit DATA ONLY
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tilasto.json data/top5.json data/ratatilasto.json vaylatilasto.png data/vaylatilasto.png ratatilasto.png data/ratatilasto.png || true
          git diff --staged --quiet || git commit -m "AUTO Metrix 44010 +3 + vari tiukka $(date +%H:%M)"
          git push

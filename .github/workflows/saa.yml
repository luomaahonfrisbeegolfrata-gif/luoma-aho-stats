name: Saa V25 Omaan Korttiin
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python saa_fetcher.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/saa.json data/foreca.json
          git diff --staged --quiet || git commit -m "V25 saa"
          git push

name: Sää V16.2 FIX - ei enää sama kuin eilen - Lukittu
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python saa_fetcher.py
      - run: |
          cat data/saa.json
          python -c "import json; d=json.load(open('data/saa.json')); assert 'temp' in d; print(f"Temp {d['temp']}°C OK")"
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/saa.json data/status.json
          git diff --staged --quiet || git commit -m "V16.2 sää $(cat data/saa.json | grep temp) - lukittu"
          git push || true

name: Sää V15 - open-meteo 15min - Header/Layout/Kortit lukittu
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  update-saa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -c "import requests, json, pathlib; r=requests.get('https://api.open-meteo.com/v1/forecast?latitude=62.9&longitude=23.5&current=temperature_2m', timeout=10); j=r.json(); pathlib.Path('data/saa.json').write_text(json.dumps({'temp':j['current']['temperature_2m'],'source':'open-meteo.com V15','header_locked':True}, ensure_ascii=False, indent=2)); print('Sää OK')"
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/saa.json || true
          git diff --staged --quiet || git commit -m "V15 sää open-meteo - header/layout/cards lukittu" || true
          git push || true

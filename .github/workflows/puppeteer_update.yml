name: Puppeteer Stats Update
on:
  schedule:
    - cron: '0 */6 * * *'  # 6h välein = 120 run/kk, ilmainen raja 2000min
  workflow_dispatch:

concurrency:
  group: puppeteer-update
  cancel-in-progress: true

jobs:
  puppeteer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer
        run: npm install
      - name: Run puppeteer fetcher
        run: node puppeteer_fetcher.js
        continue-on-error: true
      - name: Build stats (python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests beautifulsoup4
          if [ -f scripts/build_stats.py ]; then python scripts/build_stats.py; fi
          if [ -f scripts/metrix_fetcher.py ]; then python scripts/metrix_fetcher.py; fi
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ || true
          git diff --staged --quiet || (git commit -m "puppeteer auto update" && git push)

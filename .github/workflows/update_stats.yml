vname: Update Luoma-aho Stats

on:
  schedule:
    - cron: '0 */6 * * *' # 4x päivässä, 120 ajoa/kk
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx puppeteer browsers install chrome # tärkeä!
      - run: node scripts/fetch-puppeteer.js
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add src/stats/ dist/data/
          git diff --quiet || (git commit -m "auto: väylätilasto $(date)" && git push)

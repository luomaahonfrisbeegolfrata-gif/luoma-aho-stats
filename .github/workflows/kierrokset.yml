name: Kierrokset V25
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python auto_update.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/kierrokset.json
          git diff --staged --quiet || git commit -m "V25 kierrokset"
          git push

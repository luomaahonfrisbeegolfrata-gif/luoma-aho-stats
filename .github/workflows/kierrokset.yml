name: Kierrokset V15 - Header/Layout/Kortit lukittu
on:
  schedule:
    - cron: '0 */12 * * *'  # 12h
  workflow_dispatch:
jobs:
  update-kierrokset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python auto_update.py
      - run: python -c "import json; d=json.load(open('data/kierrokset.json')); assert 500 <= d['total_rounds'] <= 5000; print('Totals OK')"
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/kierrokset.json data/status.json || true
          git diff --staged --quiet || git commit -m "V15 kierrokset 1164 - header/layout/cards lukittu"
          git push || true

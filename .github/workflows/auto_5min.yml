name: Update foreca 5min
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - run: pip install requests
      
      - run: python foreca_fetcher.py
      
      - name: Commit & Push if changed
        run: |
          git config --global user.name 'foreca-bot'
          git config --global user.email 'bot@luoma-aho.fi'
          git add data/foreca.json
          git diff --staged --quiet || (git commit -m "foreca auto 5min $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)

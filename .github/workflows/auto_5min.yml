name: foreca auto 5min

# Korjattu: ajetaan VAIN ajastuksella + manuaalisesti, ei pushilla -> ei looppaa botin commiteista
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Estää päällekkäiset ajot, jos edellinen vielä pyörii
concurrency:
  group: foreca-auto-5min
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-foreca:
    runs-on: ubuntu-latest
    # Tuplavarmistus: jos joku triggeröi pushilla botin nimissä, skipataan
    if: github.actor != 'foreca-bot'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Run Foreca fetcher
        env:
          FORECA_API_KEY: ${{ secrets.FORECA_API_KEY }}
        run: python foreca_fetcher.py

      - name: Commit & push if changed [skip ci]
        run: |
          git config user.name "foreca-bot"
          git config user.email "foreca-bot@users.noreply.github.com"
          git add data/foreca.json
          # Commit vain jos muuttunut
          if ! git diff --staged --quiet; then
            git commit -m "foreca auto 5min $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          else
            echo "No changes"
          fi

name: Full Update V5.1

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/vieraskirja.json'
      - 'vieraskirja.json'
      - '.github/workflows/vieraskirja.yml'
  workflow_dispatch:

concurrency:
  group: full-update
  cancel-in-progress: false

jobs:
  full-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4 lxml || true
      - name: Run fetchers
        continue-on-error: true
        run: |
          for f in scripts/*fetcher.py *fetcher.py; do [ -f "$f" ] && python "$f" || true; done
          for f in scripts/kierrokset.py kierrokset.py; do [ -f "$f" ] && python "$f" || true; done
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "V5.1 full update - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git pull --rebase origin main || true
          git push || echo "Push skipped"

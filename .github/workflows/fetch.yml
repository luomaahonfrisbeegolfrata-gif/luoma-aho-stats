name: fetch stats (unified v2)

# Korjaus #4: yksi unified fetcher, ei 3 erillistä -> vähemmän virheitä
on:
  schedule:
    - cron: '0 * * * *'  # tunneittain
    - cron: '30 * * * *' # ja puolelta, jos haluat 2x tunnissa, poista toinen
  workflow_dispatch:

concurrency:
  group: stats-fetch-unified
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    if: github.actor != 'foreca-bot'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests beautifulsoup4 lxml; fi

      - name: Run unified fetcher (metrix + top5 + scraper + vayla)
        env:
          METRIX_API_KEY: ${{ secrets.METRIX_API_KEY }}
          UDISC_TOKEN: ${{ secrets.UDISC_TOKEN }}
        run: |
          echo "Running unified_fetcher.py - one failure does NOT fail whole job"
          python unified_fetcher.py || echo "Unified fetcher had partial failures but continuing"

      - name: Validate JSONs
        run: |
          echo "Validating data/*.json"
          for f in data/*.json; do
            if [ -f "$f" ]; then
              echo -n "Checking $f ... "
              python -m json.tool "$f" > /dev/null && echo "OK" || echo "FAIL: $f invalid JSON"
            fi
          done

      - name: Commit & push if changed [skip ci]
        run: |
          git config user.name "foreca-bot"
          git config user.email "foreca-bot@users.noreply.github.com"
          git add data/*.json data/*.csv
          # Älä lisää PNG:tä
          git reset -- data/*.png 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "stats unified auto update $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

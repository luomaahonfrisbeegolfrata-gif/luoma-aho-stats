name: Fetch All AUTO - 15min - Ilmaisen rajan sisällä - KORJATTU

on:
  schedule:
    - cron: '*/15 * * * *'  # 15min välein, 2880/kk, pysyy ilmaisen rajan sisällä
  workflow_dispatch:

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python - KORJATTU ei etsi requirements.txt turhaan
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # EI cache: 'pip' tässä - se aiheutti virheen kun requirements.txt ei ollut commitattu
          # Jos haluat cachen, varmista että requirements.txt on repo juuressa ja commitattu

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil
          # Jos requirements.txt olemassa, asenna myös siitä
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch Foreca REAL - ILMAINEN
        run: |
          if [ -f foreca_fetcher_real.py ]; then python foreca_fetcher_real.py
          elif [ -f foreca_fetcher.py ]; then python foreca_fetcher.py
          else echo "No foreca fetcher"; fi
        continue-on-error: true

      - name: Fetch Metrix 44010 Top 10 - ILMAINEN
        run: |
          if [ -f metrix_44010_fetcher.py ]; then python metrix_44010_fetcher.py; fi
        continue-on-error: true

      - name: Fetch Metrix 44763 Top 10 - ILMAINEN
        run: |
          if [ -f metrix_44763_fetcher.py ]; then python metrix_44763_fetcher.py; fi
        continue-on-error: true

      - name: Fetch UDisc Top 10 - ILMAINEN fallback
        run: |
          if [ -f udisc_fetcher.py ]; then python udisc_fetcher.py; fi
        continue-on-error: true

      - name: Fetch Kierrokset + Peliaika + Askeleet + Kilometrit - KAIKKI AUTO SAMALLA
        run: |
          if [ -f kierrokset_fetcher_v2.py ]; then python kierrokset_fetcher_v2.py
          elif [ -f kierrokset_fetcher.py ]; then python kierrokset_fetcher.py
          fi
        continue-on-error: true

      - name: Commit and push - automaattinen dynaaminen päivitys
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json || true
          git diff --staged --quiet || git commit -m "AUTO All - Foreca + Top10 + Kierrokset + Peliaika + Askeleet + Km + Väylätilasto - 15min [skip ci]"
          git push || true

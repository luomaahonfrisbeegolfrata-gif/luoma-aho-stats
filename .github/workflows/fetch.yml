name: Fetch Top 10 AUTO

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml
          
      - name: Fetch Foreca REAL
        run: |
          python foreca_fetcher_real.py
        continue-on-error: true
        
      - name: Fetch Metrix 44010 Top 10
        run: |
          python metrix_44010_fetcher.py
        continue-on-error: true
        
      - name: Fetch Metrix 44763 Top 10
        run: |
          python metrix_44763_fetcher.py
        continue-on-error: true
        
      - name: Fetch UDisc Top 10
        run: |
          python udisc_fetcher.py
        continue-on-error: true
        
      - name: Fetch other data
        run: |
          if [ -f metrix_fetcher.py ]; then python metrix_fetcher.py; fi
          if [ -f udisc_fetcher.py ]; then python udisc_fetcher.py; fi
          if [ -f foreca_fetcher.py ]; then python foreca_fetcher.py; fi
        continue-on-error: true
        
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json || true
          git diff --staged --quiet || git commit -m "AUTO Top 10 update - Metrix 44010/44763 + UDisc + Foreca REAL [skip ci]"
          git push || true

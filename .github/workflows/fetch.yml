name: Fetch All AUTO - Väylätilasto mukana - 15min

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python - KORJATTU
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil matplotlib pillow

      - name: Fetch Foreca REAL
        run: |
          if [ -f foreca_fetcher_real.py ]; then python foreca_fetcher_real.py; fi
        continue-on-error: true

      - name: Fetch Metrix 44010 Top 10
        run: python metrix_44010_fetcher.py
        continue-on-error: true

      - name: Fetch Metrix 44763 Top 10
        run: python metrix_44763_fetcher.py
        continue-on-error: true

      - name: Fetch UDisc Top 10 - 10 riviä samat kuin 2 muuta
        run: python udisc_fetcher.py
        continue-on-error: true

      - name: Fetch Kierrokset + Peliaika + Askeleet + Kilometrit - KAIKKI AUTO SAMALLA
        run: python kierrokset_fetcher_v2.py
        continue-on-error: true

      - name: Fetch Väylätilasto - YHTÄ TÄRKEÄ KUIN VIRTA - PALAUTETTU
        run: python vaylatilasto_fetcher.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.png || true
          git diff --staged --quiet || git commit -m "AUTO All + Väylätilasto palautettu - yhtä tärkeä kuin virta [skip ci]"
          git push || true

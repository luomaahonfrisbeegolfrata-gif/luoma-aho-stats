name: Fetch weather every 5min

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python foreca_fetcher.py
      - name: Commit updated JSON
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@example.com"
          git add data/foreca.json || true
          git diff --staged --quiet || git commit -m "chore: update weather $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
